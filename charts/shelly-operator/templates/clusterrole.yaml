# Rules copied from config/rbac/role.yaml (generated by controller-gen).
# Keep them in sync manually when markers change: regenerate with
# `make manifests` and mirror the rules here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "shelly-operator.fullname" . }}
  labels:
    {{- include "shelly-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - shelly.thirdimpact.io
  resources:
  - shellydevices
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shelly.thirdimpact.io
  resources:
  - shellydevices/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - shelly.thirdimpact.io
  resources:
  - shellyprofiles
  verbs:
  - get
  - list
  - watch
