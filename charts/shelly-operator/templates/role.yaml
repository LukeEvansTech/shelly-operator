# Leader-election permissions, copied from config/rbac/leader_election_role.yaml
# and namespaced to the release namespace. Keep in sync manually.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "shelly-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shelly-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
