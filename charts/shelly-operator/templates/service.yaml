{{- if or .Values.dashboard.enabled .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shelly-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shelly-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "shelly-operator.selectorLabels" . | nindent 4 }}
  ports:
    {{- if .Values.dashboard.enabled }}
    - name: dashboard
      port: 8090
      targetPort: dashboard
      protocol: TCP
    {{- end }}
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: 8080
      targetPort: metrics
      protocol: TCP
    {{- end }}
{{- end }}
