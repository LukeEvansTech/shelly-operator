{{- if and .Values.metrics.enabled .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "shelly-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "shelly-operator.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "shelly-operator.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
{{- end }}
