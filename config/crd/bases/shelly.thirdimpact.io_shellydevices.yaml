---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: shellydevices.shelly.thirdimpact.io
spec:
  group: shelly.thirdimpact.io
  names:
    kind: ShellyDevice
    listKind: ShellyDeviceList
    plural: shellydevices
    singular: shellydevice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.model
      name: Model
      type: string
    - jsonPath: .status.deviceName
      name: Device Name
      type: string
    - jsonPath: .status.online
      name: Online
      type: boolean
    - jsonPath: .status.lastSeen
      name: Last Seen
      type: date
    - jsonPath: .status.conditions[?(@.type=="InSync")].status
      name: In Sync
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ShellyDevice represents one discovered Shelly Gen2+ device. Objects are
          created and maintained by the discovery sweeper (named by lowercased
          MAC); humans only edit spec.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ShellyDeviceSpec holds human-set overrides. The discovery sweeper never
              writes spec; it is reserved for users (via the fleet repo) to influence
              how this device is managed.
            properties:
              displayName:
                description: DisplayName overrides the fleet name map for this device.
                type: string
              paused:
                description: |-
                  Paused suspends config reconciliation for this device. Discovery
                  still updates status.
                type: boolean
              profileRef:
                description: |-
                  ProfileRef pins this device to a ShellyProfile by object name (same
                  namespace), bypassing selector matching. (Consumed by the device
                  controller in a later plan.)
                maxLength: 253
                type: string
            type: object
          status:
            description: |-
              ShellyDeviceStatus is owned by the operator: discovery records identity
              and reachability here.
            properties:
              address:
                description: Address is the host[:port] the device last answered a
                  probe at.
                type: string
              app:
                description: App is the device application name, e.g. "PlusPlugUK".
                type: string
              authEnabled:
                description: AuthEnabled reports whether the device requires digest
                  auth.
                type: boolean
              conditions:
                description: Conditions describe the device's reconciliation state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deviceName:
                description: DeviceName is the name currently configured on the device
                  itself.
                type: string
              driftedSections:
                description: |-
                  DriftedSections lists config sections that differ from the matched
                  profile (empty when in sync).
                items:
                  type: string
                type: array
              firmware:
                description: Firmware identifier, e.g. "20241011-114449/1.4.4-g6d2a586".
                type: string
              gen:
                description: Gen is the Shelly RPC API generation (2, 3, or 4).
                format: int32
                type: integer
              lastSeen:
                description: LastSeen is when the device last answered a probe.
                format: date-time
                type: string
              mac:
                description: MAC as reported by the device (uppercase hex, no separators).
                type: string
              matchedProfile:
                description: MatchedProfile is the ShellyProfile currently governing
                  this device.
                type: string
              model:
                description: |-
                  Model is the device model identifier as reported by the device,
                  e.g. "SNPL-00112UK".
                type: string
              online:
                description: Online is true while the device answers discovery sweeps.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
