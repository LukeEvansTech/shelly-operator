---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: shellyprofiles.shelly.thirdimpact.io
spec:
  group: shelly.thirdimpact.io
  names:
    kind: ShellyProfile
    listKind: ShellyProfileList
    plural: shellyprofiles
    singular: shellyprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ShellyProfile declares desired configuration for the ShellyDevices its
          selector matches. Profiles are the unit of GitOps config for the fleet.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ShellyProfileSpec declares desired configuration for a set
              of devices.
            properties:
              config:
                description: |-
                  Config declares the desired device configuration. Omitted sections
                  are unmanaged.
                properties:
                  auth:
                    description: |-
                      AuthSection declares whether device auth must be enabled, and where the
                      admin password lives.
                    properties:
                      enable:
                        type: boolean
                      passwordSecretRef:
                        description: |-
                          PasswordSecretRef names a Secret (same namespace) and key holding
                          the device admin password. Required to enforce enable=true, and
                          used to authenticate to devices that already have auth enabled.
                        properties:
                          key:
                            description: Key within the Secret's data holding the
                              value.
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  ble:
                    description: BLESection maps to the device's ble (Bluetooth Low
                      Energy) configuration.
                    properties:
                      enable:
                        type: boolean
                    type: object
                  cloud:
                    description: CloudSection maps to the device's cloud configuration.
                    properties:
                      enable:
                        type: boolean
                    type: object
                  firmware:
                    description: |-
                      FirmwareSection manages the device's firmware auto-update schedule
                      job -- the Gen2 mechanism behind "automatic updates". It is a
                      pseudo-section backed by Schedule RPCs (like auth, it is not part of
                      Shelly.GetConfig). Only stable-channel updates are ever scheduled.
                    properties:
                      autoUpdate:
                        description: |-
                          AutoUpdate declares whether the device keeps itself on the latest
                          stable firmware via a daily self-check (00:00 device-local time,
                          matching the job the Shelly app creates). Any enabled schedule job
                          calling Shelly.Update with stage "stable" satisfies it regardless
                          of timespec; jobs targeting other stages are drift. nil leaves the
                          device's setting unmanaged.
                        type: boolean
                    type: object
                  mqtt:
                    description: MQTTSection maps to the device's mqtt configuration.
                    properties:
                      enable:
                        type: boolean
                      server:
                        description: |-
                          Server is the MQTT broker address (host:port). Required when enable
                          is true.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: server is required when enable is true
                      rule: '!has(self.enable) || self.enable == false || (has(self.server)
                        && size(self.server) > 0)'
                  name:
                    description: NameSection enables device-name management.
                    properties:
                      managed:
                        description: |-
                          Managed enables name reconciliation for matching devices. The
                          desired name is resolved from ShellyDevice spec.displayName,
                          falling back to the fleet name-map ConfigMap (configurable via the
                          operator's --name-map flag, default "shelly-names", keyed by
                          lowercased MAC). false leaves the device name untouched.
                        type: boolean
                    required:
                    - managed
                    type: object
                  schedules:
                    description: |-
                      Schedules manages timed schedule jobs on the device (Schedule RPCs). When
                      this section is present, the operator takes FULL OWNERSHIP of all
                      non-firmware schedule jobs on the device: any job not declared in this
                      section will be deleted. A profile without this section leaves all
                      schedules untouched.
                    properties:
                      jobs:
                        description: Jobs is the list of schedule jobs the operator
                          must maintain.
                        items:
                          description: ScheduleJobSpec declares one schedule job.
                          properties:
                            calls:
                              description: Calls is the list of RPC invocations the
                                job performs when it fires.
                              items:
                                description: ScheduleCallSpec is one RPC call a schedule
                                  job performs.
                                properties:
                                  method:
                                    description: |-
                                      Method is the RPC method name, e.g. "Switch.Set". Shelly.Update is
                                      rejected here -- firmware auto-update is managed by config.firmware.
                                    type: string
                                  params:
                                    description: |-
                                      Params is arbitrary JSON forwarded verbatim as the RPC method's params.
                                      Use this to pass device-specific arguments, e.g. {"id":0,"on":true}.
                                    x-kubernetes-preserve-unknown-fields: true
                                required:
                                - method
                                type: object
                                x-kubernetes-validations:
                                - message: Shelly.Update is managed by the firmware
                                    section (config.firmware.autoUpdate), not the
                                    schedule section
                                  rule: self.method != 'Shelly.Update'
                              minItems: 1
                              type: array
                            enable:
                              description: Enable controls whether the job is active.
                                Defaults to true when omitted.
                              type: boolean
                            timespec:
                              description: |-
                                Timespec is a Shelly cron-like spec, e.g. "0 0 22 * * *" (seconds
                                minutes hours dom month dow). See the Shelly Schedule.Create documentation
                                for the accepted format.
                              type: string
                          required:
                          - calls
                          - timespec
                          type: object
                        type: array
                    type: object
                  switch:
                    description: |-
                      SwitchSection applies to every switch component the device exposes
                      (switch:0, switch:1, ...). Per-component overrides are not supported in
                      v1alpha1; all switch components on a device receive the same declared
                      values.
                    properties:
                      autoOff:
                        type: boolean
                      autoOffDelay:
                        description: AutoOffDelay in seconds.
                        format: int32
                        minimum: 0
                        type: integer
                      autoOn:
                        type: boolean
                      autoOnDelay:
                        description: AutoOnDelay in seconds.
                        format: int32
                        minimum: 0
                        type: integer
                      autorecoverVoltageErrors:
                        description: |-
                          AutorecoverVoltageErrors controls whether the switch automatically
                          re-enables itself after a voltage-limit trip.
                        type: boolean
                      currentLimit:
                        description: CurrentLimit in amps; the switch turns off above
                          it.
                        format: int32
                        minimum: 0
                        type: integer
                      initialState:
                        description: InitialState is the output state after power-on.
                        enum:
                        - "on"
                        - "off"
                        - restore_last
                        - match_input
                        type: string
                      powerLimit:
                        description: PowerLimit in watts; the switch turns off above
                          it.
                        format: int32
                        minimum: 0
                        type: integer
                      voltageLimit:
                        description: VoltageLimit in volts; the switch turns off above
                          it.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  system:
                    description: SystemSection maps to the device's sys configuration.
                    properties:
                      debugLevel:
                        description: |-
                          DebugLevel sets the device's debug verbosity (sys.debug.level).
                          Shelly devices accept levels 0-4; 0 disables debug output. Only
                          non-negative values are accepted.
                        format: int32
                        minimum: 0
                        type: integer
                      discoverable:
                        description: |-
                          Discoverable controls whether the device is visible via mDNS/BLE
                          advertisement (sys.device.discoverable).
                        type: boolean
                      ecoMode:
                        description: EcoMode toggles the device's power-saving mode
                          (sys.device.eco_mode).
                        type: boolean
                      latitude:
                        description: |-
                          Latitude sets the device's geographic latitude (sys.location.lat).
                          Must be a decimal number, e.g. "51.5074". Used for sunrise/sunset
                          schedules on the device.
                        pattern: ^-?\d+(\.\d+)?$
                        type: string
                      longitude:
                        description: |-
                          Longitude sets the device's geographic longitude (sys.location.lon).
                          Must be a decimal number, e.g. "-0.1278".
                        pattern: ^-?\d+(\.\d+)?$
                        type: string
                      sntpServer:
                        description: |-
                          SNTPServer sets the NTP server the device uses for time sync
                          (sys.sntp.server), e.g. "time.cloudflare.com".
                        type: string
                      timezone:
                        description: |-
                          Timezone sets the device's local timezone (sys.location.tz), e.g.
                          "Europe/London". See the Shelly API docs for the accepted tz strings.
                        type: string
                    type: object
                  ui:
                    description: |-
                      UI manages the plug LED ring and physical button on plug models that
                      expose a *_ui component (e.g. PlusPlugUK). Relay-only devices that
                      have no *_ui component in their config are unaffected; this section
                      is a no-op for them.
                    properties:
                      buttonInMode:
                        description: |-
                          ButtonInMode controls the physical button behaviour.
                          momentary = press-and-release toggles,
                          follow = output tracks button state,
                          flip = each press toggles,
                          detached = button does not affect the relay.
                        enum:
                        - momentary
                        - follow
                        - flip
                        - detached
                        type: string
                      ledMode:
                        description: |-
                          LEDMode controls what the LED ring displays.
                          power = brightness tracks power consumption,
                          switch = on/off state,
                          off = always off.
                        enum:
                        - power
                        - switch
                        - "off"
                        type: string
                      nightMode:
                        description: NightMode configures the LED night-mode dimming
                          schedule.
                        properties:
                          activeBetween:
                            description: |-
                              ActiveBetween is a [start, end] pair of "HH:MM" 24-hour local times
                              that bound the night-mode window.
                            items:
                              type: string
                            maxItems: 2
                            type: array
                          brightness:
                            description: Brightness is the LED brightness percentage
                              during night mode (0-100).
                            format: int32
                            maximum: 100
                            minimum: 0
                            type: integer
                          enable:
                            description: Enable turns night-mode dimming on or off.
                            type: boolean
                        type: object
                    type: object
                  wifi:
                    description: |-
                      WifiSection maps to the device's wifi configuration. The sta (primary)
                      and sta1 (fallback) client networks are managed, as are the onboard AP
                      and roaming settings. Devices never report stored WiFi passwords, so
                      password drift is undetectable -- passwords are injected at apply time
                      whenever a network's section is written for another reason (ssid or
                      enable drift). AP and roam fields carry no passwords and are diffed
                      directly.
                    properties:
                      ap:
                        description: AP configures the device's onboard access point
                          (wifi.ap).
                        properties:
                          enable:
                            description: Enable turns the onboard AP on or off (wifi.ap.enable).
                            type: boolean
                          rangeExtender:
                            description: |-
                              RangeExtender enables the AP range-extender mode
                              (wifi.ap.range_extender.enable).
                            type: boolean
                        type: object
                      roam:
                        description: Roam configures the client roaming parameters
                          (wifi.roam).
                        properties:
                          interval:
                            description: |-
                              Interval is the roaming scan interval in seconds
                              (wifi.roam.interval).
                            format: int32
                            minimum: 0
                            type: integer
                          rssiThreshold:
                            description: |-
                              RSSIThreshold is the RSSI level (dBm) below which the device will
                              attempt to roam to a stronger AP (wifi.roam.rssi_thr).
                            format: int32
                            type: integer
                        type: object
                      sta:
                        description: Sta is the primary client network.
                        properties:
                          enable:
                            type: boolean
                          passSecretRef:
                            description: |-
                              PassSecretRef names a Secret (same namespace) and key holding the
                              network password. Omit for open networks or to keep whatever
                              password is already stored on the device.
                            properties:
                              key:
                                description: Key within the Secret's data holding
                                  the value.
                                minLength: 1
                                type: string
                              name:
                                description: Name of the Secret.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          ssid:
                            description: SSID of the network. Required when enable
                              is true.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: ssid is required when enable is true
                          rule: '!has(self.enable) || self.enable == false || (has(self.ssid)
                            && size(self.ssid) > 0)'
                      sta1:
                        description: |-
                          Sta1 is the fallback client network, used by the device when sta is
                          unreachable. During a migration, point sta1 at the old network so a
                          bad sta rollout cannot strand devices.
                        properties:
                          enable:
                            type: boolean
                          passSecretRef:
                            description: |-
                              PassSecretRef names a Secret (same namespace) and key holding the
                              network password. Omit for open networks or to keep whatever
                              password is already stored on the device.
                            properties:
                              key:
                                description: Key within the Secret's data holding
                                  the value.
                                minLength: 1
                                type: string
                              name:
                                description: Name of the Secret.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          ssid:
                            description: SSID of the network. Required when enable
                              is true.
                            type: string
                        type: object
                        x-kubernetes-validations:
                        - message: ssid is required when enable is true
                          rule: '!has(self.enable) || self.enable == false || (has(self.ssid)
                            && size(self.ssid) > 0)'
                    type: object
                    x-kubernetes-validations:
                    - message: sta and sta1 must not declare the same ssid
                      rule: '!has(self.sta) || !has(self.sta1) || !has(self.sta.ssid)
                        || !has(self.sta1.ssid) || self.sta.ssid != self.sta1.ssid'
                  ws:
                    description: WSSection maps to the device's outbound WebSocket
                      (ws) configuration.
                    properties:
                      enable:
                        type: boolean
                    type: object
                type: object
              mode:
                default: observe
                description: |-
                  Mode controls whether drift is only reported (observe) or also
                  corrected by writing the drifted sections to the device (enforce).
                  Enforcement applies safest-first with auth second-to-last and wifi
                  dead last; failures surface on the InSync condition with reason
                  ApplyFailed.
                enum:
                - observe
                - enforce
                type: string
              priority:
                description: |-
                  Priority breaks ties when several profiles match a device: highest
                  wins, then lexicographically smallest profile name. Omitted means
                  priority 0.
                format: int32
                minimum: 0
                type: integer
              rebootWhenRequired:
                default: false
                description: |-
                  RebootWhenRequired lets the operator reboot a matched device when the
                  device reports that a setting needs a restart to take effect
                  (status.restartRequired). Default false: a reboot is a physical act on
                  whatever the plug feeds, so it is opt-in per profile rather than
                  fleet-wide.

                  Only ever set this on profiles whose loads tolerate an interruption.
                  Do NOT set it on a profile covering an out-of-band access path or
                  anything mid-task -- clearing a config flag is never worth losing the
                  route you would use to fix a failure.

                  Ignored in observe mode: a profile that does not write config has no
                  business rebooting hardware.
                type: boolean
              selector:
                description: |-
                  Selector matches ShellyDevices by their discovery labels
                  (shelly.thirdimpact.io/model, /app, /gen). A nil selector matches no
                  devices -- such a profile applies only via ShellyDevice
                  spec.profileRef. An empty non-nil selector matches every device in
                  the namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
