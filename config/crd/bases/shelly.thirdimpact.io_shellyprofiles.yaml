---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: shellyprofiles.shelly.thirdimpact.io
spec:
  group: shelly.thirdimpact.io
  names:
    kind: ShellyProfile
    listKind: ShellyProfileList
    plural: shellyprofiles
    singular: shellyprofile
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ShellyProfile declares desired configuration for the ShellyDevices its
          selector matches. Profiles are the unit of GitOps config for the fleet.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ShellyProfileSpec declares desired configuration for a set
              of devices.
            properties:
              config:
                description: |-
                  Config declares the desired device configuration. Omitted sections
                  are unmanaged.
                properties:
                  auth:
                    description: |-
                      AuthSection declares whether device auth must be enabled, and where the
                      admin password lives.
                    properties:
                      enable:
                        type: boolean
                      passwordSecretRef:
                        description: |-
                          PasswordSecretRef names a Secret (same namespace) and key holding
                          the device admin password. Required to enforce enable=true, and
                          used to authenticate to devices that already have auth enabled.
                        properties:
                          key:
                            minLength: 1
                            type: string
                          name:
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  cloud:
                    description: CloudSection maps to the device's cloud configuration.
                    properties:
                      enable:
                        type: boolean
                    type: object
                  mqtt:
                    description: MQTTSection maps to the device's mqtt configuration.
                    properties:
                      enable:
                        type: boolean
                      server:
                        description: |-
                          Server is the MQTT broker address (host:port). Required when enable
                          is true.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: server is required when enable is true
                      rule: '!has(self.enable) || self.enable == false || (has(self.server)
                        && size(self.server) > 0)'
                  name:
                    description: NameSection enables device-name management.
                    properties:
                      managed:
                        description: |-
                          Managed enables name reconciliation for matching devices. The
                          desired name is resolved from ShellyDevice spec.displayName,
                          falling back to the fleet name-map ConfigMap (configurable via the
                          operator's --name-map flag, default "shelly-names", keyed by
                          lowercased MAC). false leaves the device name untouched.
                        type: boolean
                    required:
                    - managed
                    type: object
                  switch:
                    description: |-
                      SwitchSection applies to every switch component the device exposes
                      (switch:0, switch:1, ...). Per-component overrides are not supported in
                      v1alpha1; all switch components on a device receive the same declared
                      values.
                    properties:
                      autoOff:
                        type: boolean
                      autoOffDelay:
                        description: AutoOffDelay in seconds.
                        format: int32
                        minimum: 0
                        type: integer
                      autoOn:
                        type: boolean
                      autoOnDelay:
                        description: AutoOnDelay in seconds.
                        format: int32
                        minimum: 0
                        type: integer
                      initialState:
                        description: InitialState is the output state after power-on.
                        enum:
                        - "on"
                        - "off"
                        - restore_last
                        - match_input
                        type: string
                      powerLimit:
                        description: PowerLimit in watts; the switch turns off above
                          it.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                  system:
                    description: SystemSection maps to the device's sys configuration.
                    properties:
                      ecoMode:
                        description: EcoMode toggles the device's power-saving mode
                          (sys.device.eco_mode).
                        type: boolean
                    type: object
                type: object
              mode:
                default: observe
                description: |-
                  Mode controls whether drift is only reported (observe) or also
                  corrected by writing the drifted sections to the device (enforce).
                  Enforcement applies safest-first and auth last; failures surface on
                  the InSync condition with reason ApplyFailed.
                enum:
                - observe
                - enforce
                type: string
              priority:
                description: |-
                  Priority breaks ties when several profiles match a device: highest
                  wins, then lexicographically smallest profile name. Omitted means
                  priority 0.
                format: int32
                minimum: 0
                type: integer
              selector:
                description: |-
                  Selector matches ShellyDevices by their discovery labels
                  (shelly.thirdimpact.io/model, /app, /gen). A nil selector matches no
                  devices -- such a profile applies only via ShellyDevice
                  spec.profileRef. An empty non-nil selector matches every device in
                  the namespace.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
