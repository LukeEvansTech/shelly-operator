# This rule is not used by the project shelly-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the shelly.thirdimpact.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: shelly-operator
    app.kubernetes.io/managed-by: kustomize
  name: shellyprofile-editor-role
rules:
- apiGroups:
  - shelly.thirdimpact.io
  resources:
  - shellyprofiles
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - shelly.thirdimpact.io
  resources:
  - shellyprofiles/status
  verbs:
  - get
