{{define "content"}}
<h1>Fleet</h1>
<p class="muted">{{len .Devices}} devices. Read-only: changes go through git.</p>
<table>
<tr><th>Device</th><th>Name</th><th>Model</th><th>Address</th><th>Online</th><th>Profile</th><th>In Sync</th><th>Drift</th></tr>
{{range .Devices}}
<tr>
<td><a href="/device/{{.Object}}">{{.Object}}</a></td>
<td>{{.Name}}</td>
<td>{{.Model}}</td>
<td>{{.Address}}</td>
<td>{{if .Online}}<span class="pill ok">online</span>{{else}}<span class="pill bad">offline</span>{{end}}</td>
<td>{{.Profile}}</td>
<td><span class="pill {{.SyncClass}}">{{.Sync}}</span></td>
<td>{{.Drift}}</td>
</tr>
{{end}}
</table>
{{end}}
