{{define "layout"}}<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="refresh" content="30">
<title>shelly-operator</title>
<style>
body{background:#0f172a;color:#e2e8f0;font-family:ui-sans-serif,system-ui,sans-serif;margin:0;padding:2rem}
a{color:#38bdf8;text-decoration:none} a:hover{text-decoration:underline}
table{border-collapse:collapse;width:100%;margin-top:1rem}
th,td{border-bottom:1px solid #1e293b;padding:.5rem .75rem;text-align:left;font-size:.9rem}
th{color:#94a3b8;font-weight:600;text-transform:uppercase;font-size:.75rem}
.pill{padding:.15rem .5rem;border-radius:9999px;font-size:.75rem}
.ok{background:#064e3b;color:#6ee7b7}.bad{background:#7f1d1d;color:#fca5a5}.unk{background:#3f3f46;color:#d4d4d8}
pre{background:#1e293b;padding:1rem;border-radius:.5rem;overflow:auto;font-size:.8rem}
h1,h2{font-weight:600} nav{margin-bottom:1.5rem} nav a{margin-right:1rem}
.muted{color:#64748b}
</style></head><body>
<nav><a href="/">Fleet</a><a href="/profiles">Profiles</a></nav>
{{template "content" .}}
</body></html>{{end}}
